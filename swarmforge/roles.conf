# SwarmForge pipeline. File order is the forward route.
#
#   <role> <tier> <runs-as>
#
# tier     frontier | strong | fast   (mapped per harness in tiers.conf)
# runs-as  session  | subagent
#
# `session` roles run in the operator's own chat session so they can stop,
# show their work, and wait for the operator. `subagent` roles run as
# delegated agents on the tier's model and report back to the session.
specifier frontier session
coder     strong   subagent
cleaner   fast     subagent
architect strong   subagent
hardener  fast     subagent
qa        strong   subagent
