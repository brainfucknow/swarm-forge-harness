# SwarmForge pipeline. File order is the forward route.
#
#   <role> <tier> <runs-as>
#
# tier     frontier | strong | fast   (mapped per harness in tiers.conf)
# runs-as  session  | subagent
#
# The operator's session is the orchestrator. `subagent` roles (the default)
# run as delegated agents on the tier's model and report back to it; they stop
# for the operator with `sf review` or `sf ask`. `session` is an opt-in that
# makes the orchestrator play a role in chat itself, for co-writing a
# specification turn by turn.
specifier frontier subagent
coder     strong   subagent
cleaner   fast     subagent
architect strong   subagent
hardener  fast     subagent
qa        strong   subagent
