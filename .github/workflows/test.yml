name: test
on:
  push:
  pull_request:
jobs:
  sf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No mutation manifests in the tree
        run: bash test/no_manifests.sh
      - name: Test the manifest guard
        run: bash test/no_manifests_test.sh
      - name: Install Babashka
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSL https://raw.githubusercontent.com/babashka/babashka/master/install -o install-bb
          bash install-bb --dir "$HOME/bin"
      - name: Test sf
        run: bash test/sf_test.sh
      - name: Test sf tool
        run: bash test/sf_tool_test.sh
      - name: Unit specs for sf
        run: bb --config swarmforge/tools/sf/bb.edn spec
      - name: Property tests for sf
        run: bb --config swarmforge/tools/sf/bb.edn property
      - name: Acceptance tests for sf
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bash test/acceptance.sh
      - name: Test sf-cs
        run: bb --config swarmforge/tools/csharp/bb.edn test
      - name: Test sf-js
        run: bb --config swarmforge/tools/javascript/bb.edn test
      - name: Property-test sf-js
        run: bb --config swarmforge/tools/javascript/bb.edn property
      - name: Accept sf-js
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bb --config swarmforge/tools/javascript/bb.edn acceptance
