# Named routes: which roles a task visits, in catalogue order (roles.conf).
#
#   <name> <role>[,<role>...]
#
# `sf new --route <name>` or `--route a,b,c` picks one per task; `feature` is
# the default. Any subset of the catalogue in canonical order is a valid route.
feature  specifier,coder,cleaner,architect,hardener,qa
bugfix   specifier,coder,qa
refactor cleaner,architect,hardener
harden   hardener,qa
spike    specifier
