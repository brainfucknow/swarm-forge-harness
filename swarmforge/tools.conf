# Constitution tool catalogue for `sf tool require|ensure <tool>`.
#
#   <name> <kind> <source> <task> <rewrite> <needs>
#
# kind     bb     clone <source> from GitHub; the wrapper runs `bb --config <clone>/bb.edn <task>`
#          bbmain clone <source> from GitHub; the wrapper runs `bb -cp <clone>/src -m <task>`
#          clj    run <source> (a Maven coordinate) with the Clojure CLI, main namespace <task>
#          local  run <source>, a path relative to the repository root: the caller's
#                 checkout copy when it has one, else the main checkout's
# rewrite  mutate   drop --mutate-all, force --max-workers 4 unless scanning
#          gherkin  turn --level full into --level hard, force --workers 4, and keep
#                   the block of the --feature file in .metrics/gherkin/ between runs
#          coverage run in the directory of the first source root, with the source
#                   roots made relative to it; write a Babashka coverage config; add
#                   --coverage-command for it unless the caller settled coverage or
#                   clj and deps.edn are there
#          -        no argument rewriting
# needs    comma-separated tools to install first, or -
gherkin-parser         bb     github.com/unclebob/Acceptance-Pipeline-Specification gherkin-parser         -        -
ir-dry-checker         bb     github.com/unclebob/Acceptance-Pipeline-Specification gherkin-ir-dry-checker -        -
gherkin-mutator        bb     github.com/unclebob/Acceptance-Pipeline-Specification gherkin-mutator        gherkin  -
crap4clj               bb     github.com/unclebob/crap4clj                          crap                   coverage cloverage
dry4clj                bbmain github.com/unclebob/dry4clj                           dry4clj.core           -        -
clj-mutate             bb     github.com/unclebob/clj-mutate                        mutate                 mutate   cloverage
speclj-structure-check bb     github.com/unclebob/speclj-structure-check            check                  -        -
cloverage              clj    cloverage/cloverage                                   cloverage.coverage     -        -
speclj                 clj    speclj/speclj                                         speclj.main            -        -
crap4go                bb     github.com/unclebob/crap4go                           crap4go                -        -
dry4go                 bb     github.com/unclebob/dry4go                            dry4go                 -        -
mutate4go              bb     github.com/unclebob/mutate4go                         mutate4go              mutate   -
crap4java              bb     github.com/unclebob/crap4java                         crap4java              -        -
dry4java               bb     github.com/unclebob/dry4java                          dry4java               -        -
mutate4java            bb     github.com/unclebob/mutate4java                       mutate4java            mutate   -
sf-cs                  local  swarmforge/bin/sf-cs                                  -                      -        -
sf-js                  local  swarmforge/bin/sf-js                                  -                      -        -
sf-fs                  local  swarmforge/bin/sf-fs                                  -                      -        -
sf-vb                  local  swarmforge/bin/sf-vb                                  -                      -        -
