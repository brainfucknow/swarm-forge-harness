# SwarmForge role catalogue. File order is the canonical order a route follows.
#
#   <role> <tier> <runs-as> [audit] [optional]
#   <role> <tier> subagent gate
#   <role> <tier> subagent judge
#
# tier     frontier | strong | fast   (mapped per harness in tiers.conf)
# runs-as  subagent | session
# audit    optional: sf refuses the first `sf handoff` or `sf review` of the
#          role at a commit and prints a self-review checklist. sf records the
#          second attempt at the same commit.
# optional excluded from the fallback route; include it explicitly in a named
#          route, --route, or SWARMFORGE_ROUTE to enable it. Combines with audit.
# gate     not a stage and never on a route: a read-only subagent the
#          orchestrator (or `sf run`) dispatches on a specification after the
#          specifier's `sf review` and before the operator approves. Its report
#          is shown at the gate. `sf gates` lists them; delete the line to stop.
# judge    at most one; not a stage, not a gate, never on a route: a read-only
#          subagent that gives a verdict on each round of gate findings, which
#          the orchestrator records with `sf verdict` (see handoff-protocol.md,
#          Specification rounds). `sf dispatch` refuses it and `sf run` never
#          runs it. Delete the line to turn the loop off.
#
# The route of a task (routes.conf, `sf new --route`) sets which roles it
# visits. The operator's session is the orchestrator. A `subagent` role (the
# default) runs as a delegated agent on the tier's model and reports back to
# the orchestrator. It stops for the operator with `sf review` or `sf ask`. A
# `session` role (opt-in) runs in chat in the orchestrator itself, for example
# to write a specification with the operator turn by turn.
specifier frontier subagent
falsifier strong   subagent gate
judge     strong   subagent judge
architecture-design-reviewer strong subagent optional
coder     strong   subagent
cleaner   fast     subagent
architect strong   subagent
hardener  fast     subagent
security-reviewer strong subagent optional
qa        strong   subagent
