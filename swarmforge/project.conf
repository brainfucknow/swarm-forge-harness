# Project settings for sf. install.sh keeps this file when it reinstalls.
#
#   <setting> <value>
#
# tasks-dir  the directory of the task files, relative to the repository root
#            (default: tasks). An open task keeps <tasks-dir>/<id>.md on its
#            branch; a finished one leaves <tasks-dir>/done/<id>.md in the base
#            branch. sf reads the main checkout's setting. After changing it,
#            run `sf move-tasks <old-dir>` and commit the staged moves with it.
tasks-dir tasks
