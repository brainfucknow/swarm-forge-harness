# SwarmForge role catalogue. File order is the canonical order a route follows.
#
#   <role> <tier> <runs-as> [audit]
#
# tier     frontier | strong | fast   (mapped per harness in tiers.conf)
# runs-as  subagent | session
# audit    optional: the role's first `sf handoff` or `sf review` at a given
#          commit is refused with a self-review checklist; the second attempt
#          at the same commit is recorded.
#
# Which roles a task visits is its route (routes.conf, `sf new --route`), not
# this file. The operator's session is the orchestrator. `subagent` roles (the
# default) run as delegated agents on the tier's model and report back to it;
# they stop for the operator with `sf review` or `sf ask`. `session` is an
# opt-in that makes the orchestrator play a role in chat itself, for co-writing
# a specification turn by turn.
specifier frontier subagent
coder     strong   subagent
cleaner   fast     subagent
architect strong   subagent
hardener  fast     subagent
qa        strong   subagent
