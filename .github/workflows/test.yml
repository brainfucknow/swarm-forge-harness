name: test
on:
  push:
  pull_request:
jobs:
  sf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No mutation manifests in the tree
        run: bash test/no_manifests.sh
      - name: Test the manifest guard
        run: bash test/no_manifests_test.sh
      - name: Install Babashka
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSL https://raw.githubusercontent.com/babashka/babashka/master/install -o install-bb
          bash install-bb --dir "$HOME/bin"
      - name: Test sf
        run: bash test/sf_test.sh
      - name: Test sf tool
        run: bash test/sf_tool_test.sh
      - name: Unit specs for sf
        run: bb --config swarmforge/tools/sf/bb.edn spec
      - name: Hardening checks for sf
        run: bb --config swarmforge/tools/sf/bb.edn hardening
      - name: Property tests for sf
        run: bb --config swarmforge/tools/sf/bb.edn property
      - name: Acceptance tests for sf
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bash test/acceptance.sh
      - name: Test sf-cs
        run: bb --config swarmforge/tools/csharp/bb.edn test
      - name: Test sf-js
        run: bb --config swarmforge/tools/javascript/bb.edn test
      - name: Property-test sf-js
        run: bb --config swarmforge/tools/javascript/bb.edn property
      - name: Accept sf-js
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bb --config swarmforge/tools/javascript/bb.edn acceptance
      - name: Unit specs for sf-java
        run: bb --config swarmforge/tools/java/bb.edn spec
      - name: Hardening checks for sf-java
        run: bb --config swarmforge/tools/java/bb.edn hardening
      - name: Property tests for sf-java
        run: bb --config swarmforge/tools/java/bb.edn property
      - name: Accept sf-java
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bb --config swarmforge/tools/java/bb.edn acceptance
      - name: Test sf-rb
        run: bb --config swarmforge/tools/ruby/bb.edn test
      - name: Property-test sf-rb
        run: bb --config swarmforge/tools/ruby/bb.edn property
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler: "4.0.18"
      - name: End-to-end sf-rb with the real gems
        run: bash test/sf_rb_e2e_test.sh
