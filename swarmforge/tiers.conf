# Model for each tier and harness. After a change, run `swarmforge/bin/sf adapters`.
#
#   <tier> <claude-model> <codex-reasoning-effort> <copilot-model>
#
# claude-model            value for `model:` in .claude/agents (inherit, opus, sonnet, haiku, or a full id)
# codex-reasoning-effort  value for `model_reasoning_effort` in .codex/agents (low, medium, high)
# copilot-model           value for `model:` in .github/agents (see `copilot --help` for ids)
frontier inherit high   gpt-6.1-sol
strong   opus    medium gpt-6.1-sol
fast     sonnet  low    gpt-6.1-terra
